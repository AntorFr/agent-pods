<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Nestor">
  <!-- Blason Nestor — la silhouette du Nabaztag, ventre allumé.
       Là où le blason de Skippy a dû sacrifier 64 graduations pour survivre à
       16 px, le lapin passe TEL QUEL : c'est une silhouette, il n'y a rien à
       simplifier. Yeux et museau sont des trous dans le glyphe (sous-chemins en
       sens inverse), donc c'est la plaque qui fait le visage — et le dessin
       tient en une seule couleur, à n'importe quelle taille.
       Le tracé sort de la police « Nestor » fournie par Monsieur : la pose
       canonique, oreilles dressées, pas la pose de la photo.

       ⚠️ Cet actif est servi par `/icon.svg` AVANT que le moindre JavaScript ne
       tourne — le navigateur le réclame pour l'onglet et l'écran d'accueil. Il
       est donc autonome : aucune variable CSS de la coque, que des valeurs
       littérales. La copie « vivante » du même lapin est dans skins/nestor.js. -->
  <defs>
    <radialGradient id="ventre" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#B9A3FF" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#8B6CE8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8B6CE8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plaque" cx="30%" cy="12%" r="120%">
      <stop offset="0" stop-color="#3A2B66"/>
      <stop offset=".6" stop-color="#241B45"/>
      <stop offset="1" stop-color="#1B1435"/>
    </radialGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="url(#plaque)"/>

  <!-- Le lapin est déjà centré dans son carré (bbox y 7→93, x 26,5→73,5) :
       une simple homothétie autour du centre suffit à le poser sur la plaque. -->
  <g transform="translate(50 50) scale(.884) translate(-50 -50)">
    <!-- Le halo du ventre passe SOUS la porcelaine : c'est une lumière interne. -->
    <circle cx="50" cy="78" r="15" fill="url(#ventre)"/>
