# Builds and publishes every image under images/<name>/ to GHCR.
#
# Monorepo tagging contract (one repo, several images):
#   git tag <image>-vX.Y.Z   ->  ghcr.io/antorfr/<image>:X.Y.Z (+ :X.Y :X)
#   push on main             ->  ghcr.io/antorfr/<image>:main (all images)
#   pull request             ->  build only, no push
#
# Multi-arch policy: amd64+arm64 on stable release tags only; everything
# else (main, prereleases) builds amd64 alone to keep CI fast.
name: docker-publish

on:
  push:
    branches: [main]
    tags: ['*-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # Les bancs, AVANT le moindre build. Ils tournent sur agent-gw, seule image qui
  # en porte — les deux autres n'ont pas de suite, et un job qui ne teste rien
  # vaut mieux absent que vert.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # la version du runtime d'agent-gw
      - name: Dépendances Python
        working-directory: images/agent-gw
        run: pip install -r requirements.txt

      - name: Bancs Python
        working-directory: images/agent-gw
        # Un par un : le banc qui échoue est nommé dans le log, là où un `for`
        # silencieux obligerait à relire toute la sortie.
        run: |
          set -e
          for t in test/*.py; do echo "── $t"; python "$t"; done

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: images/agent-gw/frontend/package-lock.json
      - name: Bancs front
        working-directory: images/agent-gw/frontend
        run: npm ci && npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [claude-pod, agent-gw, agent-voice]
    steps:
      # On a tag push, build only the image the tag belongs to
      - name: Skip images not matching this tag
        id: gate
        run: |
          if [ "${{ github.ref_type }}" = "tag" ] && ! echo "${{ github.ref_name }}" | grep -q "^${{ matrix.image }}-v"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: docker/setup-qemu-action@v3
        if: steps.gate.outputs.run == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.run == 'true'

      - name: Login GHCR
        if: steps.gate.outputs.run == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        if: steps.gate.outputs.run == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=match,pattern=${{ matrix.image }}-v(\d+\.\d+\.\d+.*),group=1
            type=match,pattern=${{ matrix.image }}-v(\d+\.\d+)\.\d+$,group=1
            type=match,pattern=${{ matrix.image }}-v(\d+)\.\d+\.\d+$,group=1
            type=sha,prefix=sha-

      - name: Detect stable release (multi-arch gate)
        id: release
        if: steps.gate.outputs.run == 'true'
        run: |
          # stable = tag <image>-vX.Y.Z with no prerelease suffix
          if echo "${{ github.ref_name }}" | grep -Eq "^${{ matrix.image }}-v[0-9]+\.[0-9]+\.[0-9]+$"; then
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          fi

      # ── Le garde-fou qui manquait le 2026-08-19 ────────────────────────────
      # Les bancs ci-dessus ne suffisent PAS, et l'incident le prouve : ils
      # tournent sur un venv dont la résolution de dépendances est figée depuis
      # des mois. Ce jour-là, retirer `workspace-mcp` a libéré la contrainte
      # transitive qui plafonnait `mcp` en 1.x, `mcp>=1.2` a résolu en 2.0.0 —
      # qui supprime `mcp.server.fastmcp` — et la gateway ne démarrait PLUS DU
      # TOUT. Verte au banc, morte à l'exécution.
      #
      # Seule une image FRAÎCHEMENT construite le voit. On la charge donc en
      # local (amd64) et on l'ouvre, AVANT de publier quoi que ce soit : un tag
      # cassé sur GHCR est un piège qu'on retrouve des jours plus tard.
      # Le cache est partagé avec le build de publication ci-dessous : le coût
      # réel est un export d'image, pas une seconde construction.
      - name: Construire pour le smoke (amd64, chargée localement)
        if: steps.gate.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.image }}
          platforms: linux/amd64
          load: true
          push: false
          tags: smoke-${{ matrix.image }}:${{ github.sha }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Smoke — l'image démarre-t-elle vraiment ?
        if: steps.gate.outputs.run == 'true'
        run: |
          set -eu
          IMG=smoke-${{ matrix.image }}:${{ github.sha }}
          case "${{ matrix.image }}" in
            agent-gw)
              # L'import, c'est-à-dire tout ce qui se résout au démarrage.
              docker run --rm -e GW_WORKSPACE=/tmp "$IMG" \
                python -c "import app.main; print('gateway importable')"
              # Et les exécutables : la boucle d'installation des bin/ de plugins
              # ne dit rien quand elle ne copie rien.
              docker run --rm --entrypoint sh "$IMG" -c \
                'for b in mcp-bridge trace-geom git-credential-hub; do
                   command -v "$b" >/dev/null || { echo "manquant: $b" >&2; exit 1; }
                 done; echo "binaires en place"'
              ;;
            agent-voice)
              docker run --rm "$IMG" python -c "import app.main; print('voice importable')"
              ;;
            claude-pod)
              # Pas d'application Python ici : ce qu'on vérifie, c'est que le
              # relais MCP est bien sur le PATH et qu'il refuse proprement.
              docker run --rm --entrypoint sh "$IMG" -c \
                'command -v mcp-bridge >/dev/null && echo "relais en place"'
              ;;
          esac

      - name: Build & push
        if: steps.gate.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.image }}
          platforms: ${{ steps.release.outputs.platforms }}
          # Version SemVer résolue par metadata-action (ex. 0.33.2 ; « main » sur un
          # push de branche). Seule agent-gw la consomme, pour l'afficher dans ses
          # Réglages ; les autres images ignorent l'arg (warning bénin au build).
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
